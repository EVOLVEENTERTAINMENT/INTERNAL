<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evolve OS</title><meta name="theme-color" content="#0B0B0C"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0B0B0C;--s1:#141416;--s2:#1A1A1D;--hair:rgba(255,255,255,.09);--fg:#F2F2F4;--fg3:#82828C;--acc:#F2703F;--bad:#E0574E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--hair);border-radius:14px;padding:22px}
img{width:56px;height:56px;display:block;margin:0 0 14px}h1{font-size:20px;margin:0 0 16px}
label{display:block;font-size:13px;color:var(--fg3);margin:12px 0 5px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--hair);background:var(--s2);color:var(--fg);font:inherit}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#0B0B0C;font:700 16px -apple-system,sans-serif}
#msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
</style></head><body>
<form id="f"><img src="icon.png" alt=""><h1>Evolve OS</h1>
<label for="e">Email</label><input id="e" type="email" autocomplete="username" required>
<button id="go">Email me a sign-in link</button><div id="msg"></div></form>
<script src="supabase.js"></script><script src="config.js"></script>
<script>
const C=window.EVOLVE_WEB, sb=supabase.createClient(C.url,C.anon,{auth:{persistSession:true,flowType:'pkce',detectSessionInUrl:false}});
const $=id=>document.getElementById(id), msg=$('msg'), q=new URLSearchParams(location.search);
(async()=>{
  const have=await sb.auth.getSession(); if(have.data.session){location.replace('board.html');return;}
  if(q.get('code')){ const r=await sb.auth.exchangeCodeForSession(q.get('code')); history.replaceState(null,'',location.pathname);
    if(!r.error){location.replace('board.html');return;} msg.textContent='That link did not work. Ask for a new one.'; return; }
  if(q.get('error')){ history.replaceState(null,'',location.pathname); msg.textContent='That link did not work. Ask for a new one.'; return; }
})();
$('f').onsubmit=async ev=>{ ev.preventDefault();
  const r=await sb.auth.signInWithOtp({email:$('e').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:new URL('index.html',location.href).href.split('?')[0]}});
  if(r.error){msg.style.color='';msg.textContent='That email could not get a link.';return;}
  msg.style.color='var(--fg3)';msg.textContent='Check your email on this phone and tap the link.'; };
</script></body></html>
