name: Put the Evolve OS phone site online

# Builds evolve-desktop/web and puts it on the gh-pages branch, which GitHub
# serves at https://evolveentertainment.github.io/INTERNAL/. The pages are only
# the board's code; your data stays on Supabase behind your sign in.
on:
  workflow_dispatch:
  push:
    branches: [claude/kind-cerf-4hh0hw]
    paths:
      - 'evolve-desktop/web/**'
      - 'evolve-desktop/app/board/**'
      - 'evolve-desktop/app/shim/**'
      - '.github/workflows/phone-site.yml'

permissions:
  contents: write

concurrency:
  group: phone-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: evolve-desktop
      - run: node web/build.js && touch web/dist/.nojekyll
        working-directory: evolve-desktop
      - name: Push the built site to gh-pages
        working-directory: evolve-desktop/web/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Phone site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
