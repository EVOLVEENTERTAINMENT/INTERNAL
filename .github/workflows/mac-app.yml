name: Build the Evolve OS Mac app

# Builds the Mac app on GitHub's own Mac machines, because the app has to be
# put together on a Mac. The result is a .zip to download from the run page.
on:
  workflow_dispatch:
  push:
    paths:
      - 'evolve-desktop/**'
      - '.github/workflows/mac-app.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: evolve-desktop
    env:
      EVOLVE_TEST_PG: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: The board schema on a real Postgres
        run: psql "$EVOLVE_TEST_PG" -q -v ON_ERROR_STOP=1 -f test/pre-local.sql -f supabase/schema.sql
      - run: npm test

  mac:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: evolve-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - name: Build the app (not signed yet)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- -c.mac.identity=null
      # Sign each app as one piece (ad hoc, until Apple approval) and refuse to
      # go on if the signature does not check out. A broken signature is what
      # makes macOS say the app is damaged.
      - name: Sign the apps and check the signatures
        run: |
          for app in dist/mac-arm64/*.app dist/mac/*.app; do
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Evolve-OS-mac
          path: evolve-desktop/dist/*.zip
          retention-days: 14
      # Step 1 of the plan: open the built app on this real Mac, click every
      # tab on a made-up board, and print small screenshots into the log.
      - name: Open the app on a real Mac and tour every tab
        run: |
          node test/make-sample-board.js "$RUNNER_TEMP/sample"
          APP="$(ls -d dist/mac-arm64/*.app | head -1)"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true
          EVOLVE_DATA_DIR="$RUNNER_TEMP/data" EVOLVE_SNAPSHOT="$RUNNER_TEMP/sample" EVOLVE_TOUR="$RUNNER_TEMP/tour" EVOLVE_SHOT_WAIT=9000 \
            "$APP/Contents/MacOS/$(basename "$APP" .app)" &
          for i in $(seq 1 90); do [ -f "$RUNNER_TEMP/tour/tour.json" ] && break; sleep 2; done
          sleep 2; pkill -f "mac-arm64" || true
          cat "$RUNNER_TEMP/tour/tour.json"
          cd "$RUNNER_TEMP/tour"
          for f in *.png; do sips -s format jpeg -s formatOptions 60 --resampleWidth 640 "$f" --out "${f%.png}.jpg" >/dev/null; echo "TOUR_JPG ${f%.png} $(base64 < "${f%.png}.jpg" | tr -d '\n')"; done
          test -f tour.json
      # Step 2 of the plan: the installer. One chip at a time (two disk images
      # at once trip over each other). GitHub refuses files over 100 MB, so
      # each one is cut into parts and put on the mac-builds branch, which only
      # ever holds the newest build.
      - name: Make the installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg --arm64 --publish never --prepackaged "$(ls -d dist/mac-arm64/*.app)" -c.mac.identity=null -c.dmg.artifactName='Evolve-OS-Apple-chip.dmg' -c.dmg.format=ULFO
          npx electron-builder --mac dmg --x64 --publish never --prepackaged "$(ls -d dist/mac/*.app)" -c.mac.identity=null -c.dmg.artifactName='Evolve-OS-Intel.dmg' -c.dmg.format=ULFO
          ls -la dist/*.dmg
      # The same check your Mac does: open the installer, mark the app as
      # downloaded from the internet, and check its signature.
      - name: Check the app inside each installer like a downloaded copy
        run: |
          for d in dist/Evolve-OS-Apple-chip.dmg dist/Evolve-OS-Intel.dmg; do
            m="$(mktemp -d)"; hdiutil attach -nobrowse -readonly -mountpoint "$m" "$d" >/dev/null
            rm -rf "$RUNNER_TEMP/check.app"; ditto "$m/Evolve OS.app" "$RUNNER_TEMP/check.app"
            hdiutil detach "$m" >/dev/null
            xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Chrome;" "$RUNNER_TEMP/check.app"
            codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/check.app"
            spctl -a -vv -t exec "$RUNNER_TEMP/check.app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt" || true
            if grep -qi "damaged\|invalid\|a sealed resource is missing" "$RUNNER_TEMP/spctl.txt"; then echo "BROKEN SIGNATURE in $d"; exit 1; fi
          done
      - name: Put the installers on the mac-builds branch
        if: github.ref == 'refs/heads/claude/kind-cerf-4hh0hw'
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          # GitHub large file storage, so each installer is one file with a plain download link
          git init -q -b mac-builds
          git lfs install --local
          git lfs track "*.dmg"
          for f in Evolve-OS-Apple-chip Evolve-OS-Intel; do
            cp "$GITHUB_WORKSPACE/evolve-desktop/dist/$f.dmg" .
            shasum -a 256 "$f.dmg" >> SHA256.txt
          done
          printf 'Newest Evolve OS installers, built from %s. Download links: github.com/EVOLVEENTERTAINMENT/INTERNAL/raw/mac-builds/<name>.dmg\n' "$GITHUB_SHA" > README.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Installers from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" mac-builds
