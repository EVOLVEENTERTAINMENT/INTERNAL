name: Build the Evolve OS Mac app

# Builds the Mac app on GitHub's own Mac machines, because the app has to be
# put together on a Mac. The result is a .zip to download from the run page.
on:
  workflow_dispatch:
  push:
    paths:
      - 'evolve-desktop/**'
      - '.github/workflows/mac-app.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: evolve-desktop
    env:
      EVOLVE_TEST_PG: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: The board schema on a real Postgres
        run: psql "$EVOLVE_TEST_PG" -q -v ON_ERROR_STOP=1 -f test/pre-local.sql -f supabase/schema.sql
      - run: npm test

  mac:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: evolve-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - name: Build the app (not signed yet)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Evolve-OS-mac
          path: evolve-desktop/dist/*.zip
          retention-days: 14
      # Step 1 of the plan: open the built app on this real Mac, click every
      # tab on a made-up board, and print small screenshots into the log.
      - name: Open the app on a real Mac and tour every tab
        run: |
          node test/make-sample-board.js "$RUNNER_TEMP/sample"
          APP="$(ls -d dist/mac-arm64/*.app | head -1)"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true
          EVOLVE_DATA_DIR="$RUNNER_TEMP/data" EVOLVE_SNAPSHOT="$RUNNER_TEMP/sample" EVOLVE_TOUR="$RUNNER_TEMP/tour" EVOLVE_SHOT_WAIT=9000 \
            "$APP/Contents/MacOS/$(basename "$APP" .app)" &
          for i in $(seq 1 90); do [ -f "$RUNNER_TEMP/tour/tour.json" ] && break; sleep 2; done
          sleep 2; pkill -f "mac-arm64" || true
          cat "$RUNNER_TEMP/tour/tour.json"
          cd "$RUNNER_TEMP/tour"
          for f in *.png; do sips -s format jpeg -s formatOptions 60 --resampleWidth 640 "$f" --out "${f%.png}.jpg" >/dev/null; echo "TOUR_JPG ${f%.png} $(base64 < "${f%.png}.jpg" | tr -d '\n')"; done
          test -f tour.json
      # Step 2 of the plan: the installer. One chip at a time (two disk images
      # at once trip over each other). GitHub refuses files over 100 MB, so
      # each one is cut into parts and put on the mac-builds branch, which only
      # ever holds the newest build.
      - name: Make the installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg --arm64 --publish never -c.dmg.artifactName='Evolve-OS-Apple-chip.dmg'
          npx electron-builder --mac dmg --x64 --publish never -c.dmg.artifactName='Evolve-OS-Intel.dmg'
          ls -la dist/*.dmg
      - name: Put the installers on the mac-builds branch
        if: github.ref == 'refs/heads/claude/kind-cerf-4hh0hw'
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          for f in Evolve-OS-Apple-chip Evolve-OS-Intel; do
            split -b 45m "$GITHUB_WORKSPACE/evolve-desktop/dist/$f.dmg" "$f.dmg.part-"
            shasum -a 256 "$GITHUB_WORKSPACE/evolve-desktop/dist/$f.dmg" | awk -v n="$f.dmg" '{print $1"  "n}' >> SHA256.txt
          done
          printf 'Newest Evolve OS installers, built from %s. Parts join with cat.\n' "$GITHUB_SHA" > README.txt
          git init -q -b mac-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Installers from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" mac-builds
